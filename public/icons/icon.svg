<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#fdf8fa" />
      <stop offset="100%" stop-color="#faedf3" />
    </linearGradient>

    <!-- Hot Pink / Rose Ribbon Gradient -->
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a6d" />
      <stop offset="50%" stop-color="#ff4b7d" />
      <stop offset="100%" stop-color="#ff6699" />
    </linearGradient>

    <linearGradient id="ribbonOverlay" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4b7d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#ff6699" stop-opacity="0.95" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer Ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="url(#ribbonGrad)" stroke-width="6" stroke-opacity="0.4" />

  <!-- Negative Space Ribbon Emblem -->
  <g transform="translate(56, 56) scale(4)">
    <!-- Main Ribbon D Outer Shape -->
    <path
      d="M 22 15 L 50 15 C 72 15 88 28 88 50 C 88 72 72 85 50 85 L 22 85 C 18 85 15 82 15 78 L 15 22 C 15 18 18 15 22 15 Z"
      fill="url(#ribbonGrad)"
      filter="url(#glow)"
    />

    <!-- Ribbon Fold Depth Curve -->
    <path
      d="M 22 15 C 38 15 54 20 66 30 C 50 32 34 38 22 50 Z"
      fill="url(#ribbonOverlay)"
      opacity="0.6"
    />

    <!-- NEGATIVE SPACE CUTOUT: Speech Bubble carved inside the ribbon "D" -->
    <path
      d="M 32 32 L 56 32 C 64 32 70 38 70 46 C 70 54 64 60 56 60 L 44 60 L 36 68 L 38 60 L 32 60 C 28 60 26 57 26 53 L 26 38 C 26 34 28 32 32 32 Z"
      fill="#ffffff"
    />

    <!-- Inner Chat Dots -->
    <circle cx="43" cy="46" r="3.5" fill="url(#ribbonGrad)" />
    <circle cx="53" cy="46" r="3.5" fill="url(#ribbonGrad)" />
  </g>
</svg>
