<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Cyan Electric Primary Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Indigo Accent Gradient -->
    <linearGradient id="indigoGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  
  <!-- Outer Safety Border Ring -->
  <rect x="24" y="24" width="464" height="464" rx="95" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.3" />

  <!-- Central Emblem: Interlocking D & E Dialogue Loop -->
  <g transform="translate(56, 56) scale(4)">
    <!-- Main Outer Loop D (Speech Bubble Shape) -->
    <path
      d="M 26 30 C 26 21 35 16 48 16 C 68 16 82 28 82 44 C 82 60 67 70 48 70 L 36 70 L 24 82 L 28 68 C 22 62 18 53 18 44 C 18 38 21 33 26 30 Z"
      fill="url(#cyanGrad)"
      filter="url(#glow)"
    />

    <!-- Inner Core E (Connected Core Cutout) -->
    <path
      d="M 44 32 C 55 32 64 38 64 47 C 64 54 57 60 46 60 C 40 60 34 58 30 54 L 30 46 L 54 46 C 56 46 57 44 57 42 C 57 40 56 38 54 38 L 30 38 C 34 34 39 32 44 32 Z"
      fill="#090d16"
    />

    <!-- Accent Pulse Dot -->
    <circle cx="68" cy="30" r="6" fill="url(#indigoGrad)" />
  </g>
</svg>
