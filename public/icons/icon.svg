<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Main Speech Bubble Shape -->
  <g transform="translate(86, 96)">
    <!-- Chat bubble shadow -->
    <path d="M 40 40 L 300 40 A 40 40 0 0 1 340 80 L 340 220 A 40 40 0 0 1 300 260 L 160 260 L 90 320 L 105 260 L 40 260 A 40 40 0 0 1 0 220 L 0 80 A 40 40 0 0 1 40 40 Z" fill="#22d3ee" opacity="0.15" />
    
    <!-- Main Chat bubble -->
    <path d="M 30 20 L 310 20 A 30 30 0 0 1 340 50 L 340 210 A 30 30 0 0 1 310 240 L 150 240 L 80 300 L 95 240 L 30 240 A 30 30 0 0 1 0 210 L 0 50 A 30 30 0 0 1 30 20 Z" fill="url(#bgGrad)" stroke="url(#cyanGrad)" stroke-width="6" />

    <!-- Text: DIS -->
    <text x="50" y="145" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="78" fill="#22d3ee" filter="url(#glow)">DIS</text>
    
    <!-- Text: cutons -->
    <text x="185" y="145" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="52" fill="#ffffff">cut</text>
    
    <!-- Subtitle pill: En -->
    <rect x="50" y="170" width="240" height="36" rx="18" fill="url(#cyanGrad)" />
    <text x="170" y="195" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" fill="#0f172a" text-anchor="middle" letter-spacing="3">ENSEMBLE</text>
  </g>
</svg>
